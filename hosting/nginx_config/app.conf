# Serves the application behind a proxy that terminates TLS (Cloudflare Tunnel,
# a load balancer, or another web server). The proxy must forward
# X-Forwarded-For/-Proto/-Host and allow websocket upgrades, and its address
# must be listed in TRUSTED_PROXIES. See docs/deployment.md.
server {
    listen 8001;
    listen [::]:8001;

    server_name _;

    include /srv/laravel-starter-kit/hosting/nginx_config/snippets/app-locations.conf;
}
