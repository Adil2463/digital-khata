# Serves the application directly, with nginx terminating TLS. Replace
# example.com, and obtain the certificate before enabling this site:
# `sudo certbot certonly --nginx -d example.com`. See docs/deployment.md.
server {
    listen 80;
    listen [::]:80;

    server_name example.com;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    # The `listen ... http2` form works on every nginx the kit targets; 1.25.1+ only warns.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:laravel_starter_kit_tls:10m;
    ssl_session_timeout 1d;

    # Locations that set their own headers do not inherit this; application responses do.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /srv/laravel-starter-kit/hosting/nginx_config/snippets/app-locations.conf;
}
