# Shared by app.conf and app-https.conf; include it inside a server block.
# Setup and the values to adjust are documented in docs/deployment.md.

root /srv/laravel-starter-kit/public;
index index.php;
charset utf-8;
server_tokens off;

access_log /srv/laravel-starter-kit/hosting/nginx_logs/access.log;
error_log /srv/laravel-starter-kit/hosting/nginx_logs/error.log;

# Browsers send many sec-ch-ua and cookie headers, which exceed nginx's small
# defaults and cause spurious 400s.
client_header_buffer_size 4k;
large_client_header_buffers 8 32k;
client_max_body_size 66m;

# Distribution defaults compress only text/html.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/javascript application/json application/manifest+json application/xml font/ttf image/svg+xml text/css text/plain text/xml;

location ~ /\.(?!well-known).* {
    deny all;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Reverb's websocket endpoint is /app/{key}, which shares its prefix with the
# application's /app/* pages. Only upgrade requests go to Reverb, so every
# page keeps working and any REVERB_APP_KEY is accepted.
location /app/ {
    error_page 418 = @reverb;

    if ($http_upgrade ~* ^websocket$) {
        return 418;
    }

    try_files $uri $uri/ /index.php?$query_string;
}

location @reverb {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    # Must outlast the client's idle ping (REVERB_APP_ACTIVITY_TIMEOUT).
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# Reverb's HTTP API, which the broadcaster calls at REVERB_HOST:REVERB_PORT.
# Requests are signed with REVERB_APP_SECRET.
location ^~ /apps/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Vite output is content-hashed, so it never changes under the same URL.
location ^~ /build/assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Public-disk uploads share this origin, so a served HTML or SVG file must not
# be able to run script in it. Misses fall through to Laravel's local-disk route.
location ^~ /storage/ {
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri /index.php?$query_string;
}

location ~* \.(?:avif|css|gif|ico|jpe?g|js|map|mjs|png|svg|ttf|txt|webmanifest|webp|woff2?)$ {
    access_log off;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri /index.php?$query_string;
}

location = /index.php {
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 120s;
    # Inertia responses carry large Link preload headers.
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
    fastcgi_busy_buffers_size 64k;
}

# Only the front controller executes; any other .php file is never run or served.
location ~ \.php$ {
    return 404;
}

error_page 404 /index.php;
